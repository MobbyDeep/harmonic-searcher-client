[package]
name = "harmonic-searcher-client"
version = "0.1.0"
edition = "2021"
description = "Wrapper around the generated gRPC. Adds auth and retry semantics."

[dependencies]
futures-util = "0.3.28"
harmonic-protos = { path = "../harmonic_protos" }
log = "0.4"
prost-types = "0.13"
solana-client = "3"
solana-commitment-config = "3"
solana-keypair = "3"
solana-metrics = "3"
solana-sdk = "3"
solana-transaction-status = "3"
thiserror = "1.0.40"
tokio = "1"
tonic = { version = "0.13", features = ["tls-ring", "tls-webpki-roots"] }
