[package]
name = "harmonic-searcher-client"
version = "0.1.0"
edition = "2021"
description = "Wrapper around the generated gRPC. Adds auth and retry semantics."

[dependencies]
futures-util = "0.3.28"
harmonic-protos = { path = "../harmonic_protos" }
log = "0.4"
prost-types = "0.12"
solana-client = "3"
solana-commitment-config = "3"
# solana-keypair 3.1.2 currently fails to compile with its five8 dependency.
solana-keypair = "=3.0.0"
solana-metrics = "3"
solana-sdk = "3"
solana-transaction-status = "3"
thiserror = "1.0.40"
tokio = "1"
tonic = { version = "0.10", features = [ "tls", "tls-roots", "tls-webpki-roots"] }
